<style>
:root{--black:#111111;--yellow:#FFD400;--white:#FFFFFF;--gray:#2A2A2A;--light:#F5F5F5;--muted:#A8A8A8;--ok:#58cc02;--no:#ff4b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--black);color:var(--white);font-family:'tauhu-oo',"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
/* 標題列 */
.topbar{flex:none;display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(8px,1.1vh,14px) clamp(10px,1.4vw,28px);
  background:var(--black);border-bottom:4px solid var(--yellow);min-width:0}
.topbar .cat{flex:none;background:var(--yellow);color:var(--black);font-weight:900;font-size:clamp(13px,1.1vw,20px);padding:5px 14px;border-radius:999px;white-space:nowrap}
.topbar h1{flex:1 1 auto;min-width:0;margin:0;color:var(--yellow);font-weight:900;font-size:clamp(17px,2vw,36px);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .stat{flex:none;display:none;gap:12px;color:var(--white);font-weight:700;font-size:clamp(13px,1vw,18px);white-space:nowrap}
.topbar .stat b{color:var(--yellow)}
.topbar .home{flex:none;color:var(--white);text-decoration:none;font-weight:700;font-size:clamp(13px,1vw,18px);border:2px solid var(--white);
  border-radius:999px;padding:4px 14px;white-space:nowrap;transition:background .15s,color .15s}
.topbar .home:hover{background:var(--white);color:var(--black)}
.topbar .tbtn{flex:none;border:2px solid var(--yellow);background:transparent;color:var(--yellow);font-weight:700;font-size:clamp(13px,1vw,18px);
  border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.topbar .tbtn:hover{background:var(--yellow);color:var(--black)}
/* 主區 */
#app,#app-container{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;width:100%}
/* 入口選單：①②步驟卡＋③操作面板 */
.g-wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,24vw,440px);gap:clamp(10px,1.2vw,22px);
  padding:clamp(10px,1.4vw,24px);overflow:auto;width:100%}
.steps{display:flex;flex-direction:column;gap:clamp(10px,1.2vw,22px);min-width:0}
.step,.panel{background:var(--gray);border-radius:16px;padding:clamp(12px,1.3vw,24px);border:1px solid #3a3a3a}
.step h3,.panel h3{display:flex;align-items:center;gap:10px;margin:0 0 clamp(10px,1vw,18px);font-size:clamp(16px,1.3vw,26px);color:var(--yellow)}
.num{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--yellow);color:var(--black);display:grid;place-items:center;font-size:.85em;font-weight:900}
.opts{display:grid;gap:clamp(8px,.9vw,16px)}
.opts.m2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.n{grid-template-columns:repeat(auto-fill,minmax(clamp(92px,8.5vw,160px),1fr))}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:clamp(56px,7vh,96px);padding:10px 14px;
  background:var(--white);color:var(--black);border:3px solid var(--white);border-radius:14px;cursor:pointer;font-weight:900;
  font-size:clamp(17px,1.45vw,30px);line-height:1.2;text-align:left;transition:transform .12s,box-shadow .12s;white-space:nowrap}
.opt *{pointer-events:none}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.opt .ic{flex:none;width:clamp(34px,2.6vw,52px);height:clamp(34px,2.6vw,52px);border-radius:50%;background:var(--black);color:var(--yellow);
  display:grid;place-items:center;font-size:clamp(14px,1.1vw,22px);font-weight:900}
.opt .ic svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.opt .tx small{display:block;font-size:.55em;font-weight:700;color:#555;margin-top:3px;white-space:normal}
.opt .big{font-size:1.25em}.opt .u{font-size:.55em;font-weight:700;margin-left:2px;align-self:flex-end;margin-bottom:.35em}
.opt.sel,.opt.selected{background:var(--yellow);border-color:var(--white)}
.opt.sel::after,.opt.selected::after{content:"✓";position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:var(--black);
  color:var(--yellow);display:grid;place-items:center;font-size:15px;font-weight:900;border:2px solid var(--yellow)}
.panel{display:flex;flex-direction:column;gap:clamp(10px,1vw,18px);min-width:0}
.sum{background:var(--black);border-radius:12px;padding:12px 14px;font-size:clamp(14px,1vw,19px);line-height:1.9}
.sum span{color:var(--muted);margin-right:10px}.sum b{color:var(--white)}.sum b.none{color:#777;font-weight:400}
.startbtn{width:100%;border:none;border-radius:14px;background:var(--yellow);color:var(--black);font-weight:900;font-size:clamp(20px,1.7vw,34px);
  padding:clamp(14px,1.6vh,24px) 10px;cursor:pointer;box-shadow:0 5px 0 #b39500;transition:transform .1s}
.startbtn:active{transform:translateY(4px);box-shadow:none}
.startbtn:disabled{background:transparent;color:#777;border:2px dashed #555;box-shadow:none;cursor:default}
.tip{color:var(--muted);font-size:clamp(12px,.9vw,16px);line-height:1.6;margin:0}
.tip b{color:var(--yellow)}
.corner{flex:none;text-align:right;color:#8a8a8a;font-size:12px;padding:3px 12px 4px;background:var(--black);border-top:1px solid #222}
@media (max-width:860px),(orientation:portrait){
  body{overflow:auto}
  .g-wrap{grid-template-columns:1fr;overflow:visible}
  .opts.m2{grid-template-columns:1fr}
}
@media (orientation:portrait) and (min-width:600px){.opts.m2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-height:520px) and (orientation:landscape){.opt{min-height:44px;font-size:17px}.tip{display:none}.g-wrap{padding:8px;grid-template-columns:minmax(0,1fr) 230px}
  .opts.m2{grid-template-columns:repeat(2,minmax(0,1fr))}.step h3,.panel h3{margin-bottom:8px}}

#menu-screen,#result-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%}
#result-screen{display:none;justify-content:center;align-items:center;gap:16px;padding:20px;text-align:center}
.result-title{font-size:clamp(24px,3vw,48px);font-weight:900}
.result-score{font-size:clamp(28px,4vw,64px);font-weight:900;color:var(--yellow)}
#result-screen .startbtn{width:auto;padding:14px 40px}
#game-screen{display:none;flex:1 1 auto;min-height:0;flex-direction:row;gap:clamp(10px,1.4vw,24px);padding:clamp(10px,1.4vw,24px)}
.options-area{width:38%;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:0}
.option-card{flex:1 1 0;min-height:0;display:flex;align-items:center;padding:0 16px;background:var(--white);color:var(--black);border:3px solid var(--white);
  border-radius:14px;box-shadow:0 4px 0 #888;cursor:pointer;font-size:clamp(1.4rem,3.6vh,2.8rem);font-weight:700;transition:transform .1s}
.option-card:hover{border-color:var(--yellow)}
.option-card:active{transform:translateY(4px);box-shadow:none}
.option-card.wrong{background:#ffdfe0;border-color:var(--no);color:var(--no);box-shadow:0 4px 0 #ea2b2b}
.option-tag{flex:none;width:44px;height:44px;margin-right:14px;border-radius:50%;background:var(--black);color:var(--yellow);border:2px solid var(--black);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem}
.option-text{flex:1 1 auto;line-height:1.15;overflow:hidden;max-height:100%}
.question-area{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--gray);border-left:6px solid var(--yellow);
  border-radius:16px;padding:clamp(12px,1.6vw,30px);overflow:hidden}
.question-text{width:100%;max-height:100%;overflow-y:auto;font-size:clamp(1.7rem,4.6vh,4.2rem);line-height:1.5;color:var(--white);text-align:left}
.footer-controls{display:none;flex:none;justify-content:flex-end;gap:10px;padding:0 clamp(10px,1.4vw,24px) 8px}
.nav-btn{border:2px solid #555;background:var(--gray);color:var(--white);border-radius:12px;padding:8px 18px;font-weight:900;cursor:pointer;font-size:clamp(14px,1vw,18px)}
.nav-btn:hover{border-color:var(--yellow)}
@media (max-width:768px) and (orientation:portrait){
  #game-screen{flex-direction:column-reverse}
  .options-area{width:100%;height:55%;flex:none}
  .question-area{height:45%;flex:none}
  .option-card{font-size:clamp(1.1rem,2.8vh,1.8rem)}
  .question-text{font-size:clamp(1.15rem,3.6vh,2.6rem)}
  body{overflow:hidden}
}
</style>

<script>
/* 黑黃白選單共用：題數選擇＋摘要＋開始鈕 — © 2026 詹宗龍（臺中明道中學） */
var md = { count: null };
function mdPickCount(el, n, label) {
  md.count = n;
  el.parentNode.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('sel'); });
  el.classList.add('sel');
  var s = document.getElementById('sum-count'); s.textContent = label; s.className = '';
  document.getElementById('md-start').disabled = false;
}
function mdSetMode(label) { var s = document.getElementById('sum-mode'); if (s) { s.textContent = label; s.className = ''; } }
</script>
<script>
    // 資料庫內容 (1-209)
    const rawData = [
{id:1, q:"伊自細漢就和厝裡的人講臺語，這馬講甲足__________的，後來去做臺語配音員，人足愛倩伊的。空格仔內底佗一个選項上適當？", a:"精光", b:"奢颺", c:"端的", d:"撆紮", ans:"C", ansText:"端的"},
{id:2, q:"阮囝佇學校拍籃球無細膩跋倒，__________tauh一下缺一角。少年人愛媠，佇頭前歹看，好佳哉去齒科補好矣，這馬就敢笑矣。空格仔內底佗一个選項上適當？", a:"後齻", b:"屎桮齒", c:"奶齒", d:"角齒", ans:"B", ansText:"屎桮齒"},
{id:3, q:"阿母共_____囥佇衫櫥仔內，按呢虼蚻才袂走入去，毋過衫穿佇身軀䆀味䆀味。空格仔內底佗一个選項上適當？", a:"臭礬", b:"臭油", c:"臭腥仔", d:"臭藥丸仔", ans:"A", ansText:"臭礬"},
{id:4, q:"某的，咱囝的個性誠「十角」，定共你氣惱，嘛誠多謝你費心神咧共斟酌，體諒我較無閒。請問「十角」佮下底佗一个選項上倚意？", a:"雜插", b:"雜唸", c:"散仙", d:"龜毛", ans:"C", ansText:"散仙"},
{id:5, q:"恁孫當咧學行路，佇大埕捒彼台有聲的_____，有夠古錐。有練有差，另工就走敢若飛囉！你敢逐會著？請問空格仔內底佗一个選項上適當？", a:"銅管仔車", b:"烏頭仔車", c:"野雞仔車", d:"雞鵤仔車", ans:"D", ansText:"雞鵤仔車"},
{id:6, q:"古早人欲有_____衫通穿，著家己經布來做，費氣閣厚工。空格仔內底佗一个選項無適當？", a:"一領", b:"兩領", c:"一兩領", d:"一領仔", ans:"B", ansText:"兩領"},
{id:7, q:"彼張銀票毋但舊舊舊，閣皺襞襞，專_____，敢會使佮你換新的？我的khî-móo-tsih會較好。空格仔內底佗一个選項上適當？", a:"áu-bân", b:"áu-pôo", c:"áu-ut", d:"áu-hûn", ans:"D", ansText:"áu-hûn"},
{id:8, q:"生理人_____較活，若阮作穡人，看天食飯，就較_____。空格仔內底佗一个選項上適當？", a:"喙水；乏", b:"錢水；乏", c:"油湯；渴", d:"油滓；渴", ans:"B", ansText:"錢水；乏"},
{id:9, q:"下底佗一種樹欉的葉仔佇秋冬的季節會轉紅？看著誠有詩意，閣有誠濟人會起去山頂看。", a:"ka-tang", b:"png-á", c:"khóo-līng-á", d:"tshîng-á/ tsîng-á", ans:"B", ansText:"png-á"},
{id:10, q:"Khì káng-á-pinn bé「hiān-lâu-á」, m̄-nā tshinn mā ke tsin sio̍k. 「  」的漢字用下底佗一 个選項上適當？", a:"獻樓仔", b:"獻漏仔", c:"現撈仔", d:"現流仔", ans:"D", ansText:"現流仔"},
{id:11, q:"阿芬仔，愛留寡予人探聽咧，緊共房間的彼幾包_______提出來擲，毋通囤咧，才袂規間遐_______，咧欲生蟲矣。空格仔內底佗一个選項上適當？", a:"糞埽；垃圾", b:"垃圾；驚人", c:"糞埽；齷齪", d:"垃圾；囉嗦", ans:"A", ansText:"糞埽；垃圾"},
{id:12, q:"伊是出名的________，一寡細間的店，予伊那拐那唬，遐拈遐佔，攏予食食去矣。 空格仔內底佗一个選項上適當？", a:"剪綹仔", b:"生理虎", c:"喑噁的", d:"浮浪貢的", ans:"B", ansText:"生理虎"},
{id:13, q:"下底佗一句的閩南語用字、語詞、語法是正確的？", a:"我日時做工課上無閒，下晡下班才會去賊仔市買菜，遐的物件有影較俗", b:"風颱咧欲來矣，咱兜的冰箱空空空，咱著緊來去款寡菜，才袂無物通食", c:"逐家先品予好，若奕輸毋通起屁面哦", d:"伊這改的表現真漏氣，有夠失體面", ans:"B", ansText:"風颱咧欲來矣，咱兜的冰箱空空空，咱著緊來去款寡菜，才袂無物通食"},
{id:14, q:"因為疫情嚴重，政府規定出門愛掛喙罨。少年家阿俊想講若照規定行，伊的緣投仔 面就無人看會著矣，哪會有查某囡仔會來佮伊開講咧？伊不時都共喙罨剝落來提佇 手裡，目睭褫甲大大蕊咧相、咧唌查某囡仔。伊無掛喙罨，人驚予伊的瀾鬚噴著， 顛倒無人敢倚近伊。欠喙罨的保護，尾仔伊真正予人穢著，有夠害。咱會當用佗一句話形容阿俊的情形？", a:"無補顛倒惱", b:"捾籃仔假燒金", c:"三八假賢慧", d:"大目新娘揣無灶", ans:"A", ansText:"無補顛倒惱"},

    ];

    let gameQuestions = [];
    let currentQuestionIndex = 0;
    let isQuestionAnswered = false;
    let currentScore = 0;
    let isFirstAttempt = true; 
    let audioContext = null;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function playSound(type) {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioContext.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        }
    }

    function startGame(count) {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        let pool = [...rawData];
        shuffleArray(pool);
        
        if (count !== 'all') {
            gameQuestions = pool.slice(0, parseInt(count));
        } else {
            gameQuestions = pool;
        }

        currentQuestionIndex = 0;
        currentScore = 0; 
        
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none'; 
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('game-controls').style.display = 'flex';
        document.getElementById('status-bar').style.display = 'flex'; 

        renderQuestion();
    }

    function showResult() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('game-controls').style.display = 'none';
        
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('final-score').textContent = currentScore;
    }

    function renderQuestion() {
        isQuestionAnswered = false;
        isFirstAttempt = true; 
        
        const qData = gameQuestions[currentQuestionIndex];
        
        document.getElementById('q-counter').textContent = `${currentQuestionIndex + 1}/${gameQuestions.length}`;
        document.getElementById('score-counter').textContent = currentScore;

        const qTextEl = document.getElementById('question-text');
        qTextEl.textContent = qData.q;

        // --- Question Smart Scaling ---
        qTextEl.style.fontSize = ""; 
        if (window.innerWidth <= 768) {
            const len = qData.q.length;
            if (len > 50) {
                qTextEl.style.fontSize = "clamp(1.2rem, 3vh, 1.8rem)";
            } else if (len > 30) {
                qTextEl.style.fontSize = "clamp(1.3rem, 3.5vh, 2.2rem)";
            }
        }
        // -----------------------

        let optionsArr = [
            { text: qData.a, isCorrect: qData.ansText === qData.a },
            { text: qData.b, isCorrect: qData.ansText === qData.b },
            { text: qData.c, isCorrect: qData.ansText === qData.c },
            { text: qData.d, isCorrect: qData.ansText === qData.d }
        ];

        const hasCorrect = optionsArr.some(o => o.isCorrect);
        if (!hasCorrect) {
            const map = { 'A':0, 'B':1, 'C':2, 'D':3 };
            const correctIndex = map[qData.ans.trim().toUpperCase()];
            optionsArr[0].isCorrect = (correctIndex === 0);
            optionsArr[1].isCorrect = (correctIndex === 1);
            optionsArr[2].isCorrect = (correctIndex === 2);
            optionsArr[3].isCorrect = (correctIndex === 3);
        }

        shuffleArray(optionsArr);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const labels = ['A', 'B', 'C', 'D'];
        
        optionsArr.forEach((opt, index) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            
            // --- Option Smart Scaling ---
            // 檢查選項長度並設定內聯樣式
            const textLen = opt.text.length;
            if (textLen > 25) {
                // 字數極長，縮小字體
                card.style.fontSize = "clamp(1rem, 2.5vh, 1.8rem)";
            } else if (textLen > 15) {
                // 字數稍長，微調字體
                card.style.fontSize = "clamp(1.2rem, 3vh, 2.2rem)";
            }
            // 否則使用 CSS 預設的 clamp
            
            const tag = document.createElement('div');
            tag.className = 'option-tag';
            tag.textContent = labels[index];
            
            const text = document.createElement('div');
            text.className = 'option-text';
            text.textContent = opt.text;

            card.appendChild(tag);
            card.appendChild(text);

            card.onclick = () => handleAnswer(card, opt.isCorrect);

            optionsContainer.appendChild(card);
        });
    }

    function handleAnswer(element, isCorrect) {
        if (isQuestionAnswered) return;

        if (isCorrect) {
            playSound('correct');
            if (isFirstAttempt) {
                currentScore += 1;
                document.getElementById('score-counter').textContent = currentScore;
            }

            element.style.backgroundColor = '#d7ffb8';
            element.style.borderColor = '#58cc02';
            element.style.color = '#58a700';
            element.querySelector('.option-tag').style.borderColor = '#58cc02';
            element.querySelector('.option-tag').style.color = '#58cc02';
            
            isQuestionAnswered = true; 

            setTimeout(function() {
                nextQuestion();
            }, 800);

        } else {
            playSound('wrong');
            isFirstAttempt = false;
            element.classList.add('wrong');
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < gameQuestions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            showResult(); 
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function backToMenu() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('status-bar').style.display = 'none';
        document.getElementById('game-controls').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'flex';
    }

</script>
</body>
</html>
